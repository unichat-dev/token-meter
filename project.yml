# XcodeGen project spec — the .xcodeproj is generated, never committed.
# Setup: brew install xcodegen && xcodegen generate
name: TokenMeter

options:
  bundleIdPrefix: com.unichatdigital
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Notarization requirement for Developer ID distribution.
    ENABLE_HARDENED_RUNTIME: YES
    # Deliberately NOT sandboxed — the app must read ~/.claude via Full Disk
    # Access. Distribution is Developer ID direct download, not App Store.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  TokenMeter:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "Widget/**" # WidgetKit extension gets its own target later
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unichatdigital.tokenmeter
        PRODUCT_NAME: TokenMeter
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: TokenMeter
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Menu-bar-only app: no Dock icon, no app switcher entry.
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Copyright © 2026 UniChat Dev - Ilhan Akbudak. Apache-2.0."

  TokenMeterTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TokenMeter

schemes:
  TokenMeter:
    build:
      targets:
        TokenMeter: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TokenMeterTests
    archive:
      config: Release
